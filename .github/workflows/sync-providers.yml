name: Sync provider inventory

on:
  schedule:
    # Daily 11:00 Asia/Kolkata (IST, UTC+5:30) → 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - id: skip
        uses: step-security/skip-duplicate-actions@v5
        with:
          concurrent_skipping: always

  sync:
    needs: should-run
    if: needs.should-run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Extract providers from sources
        run: npm run sync:providers

      - name: Validate inventory (Zod)
        run: npm run validate:providers

      - name: Open pull request (no auto-merge)
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          commit-message: "chore(data): sync provider inventory"
          branch: chore/data-sync-providers
          title: "chore(data): sync provider inventory"
          body: |
            Automated provider sync (`sync:providers` → `validate:providers`).

            Uses `config/firecrawl-sources.json` on `main`. Merge discovery PRs first when you want fresh sources included.

            Review inventory diff, then merge manually.
          add-paths: |
            public/agent-sandbox-providers.json
